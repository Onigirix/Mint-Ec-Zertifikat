#cargo-features = ["profile-rustflags"]

[package]
name = "Mint-EC"
version = "0.0.1"
description = "Mint-EC-Zertifikat-Generator"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mint_ec_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["devtools"] }
tauri-plugin-shell = "2.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite"] }
# Reduced tokio features for faster compile times and smaller binary
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "fs", "macros"] }
bitflags = "2.10.0"
derive-error = "0.0.5"
encoding_rs = "0.8.35"
lopdf = "0.38.0"
chrono = "0.4.42"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
tauri-plugin-prevent-default = { version = "4.0.3", features = ["platform-windows"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2" }

[profile.dev]
incremental = false
#rustflags = ["-Zthreads=12"]

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.9.0"
#rustflags = ["-Zthreads=12"]
