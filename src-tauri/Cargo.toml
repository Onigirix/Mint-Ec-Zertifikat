#cargo-features = ["profile-rustflags"]

[package]
name = "Mint-EC"
version = "0.4.2"
description = "Mint-EC-Zertifikat-Generator"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mint_ec_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = ["devtools"] }
tauri-plugin-shell = "2.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite"] }
tokio = { version = "1.48.0", features = ["full"] }
bitflags = "2.10.0"
derive-error = "0.0.5"
encoding_rs = "0.8.35"
lopdf = "0.38.0"
chrono = "0.4.42"
tauri-plugin-sql = { version = "2.3.0", features = ["sqlite"] }
tauri-plugin-prevent-default = { version = "3.0.3", features = ["platform-windows"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-process = "2.3.0"
rfd = { version = "0.15.4" }
tauri-plugin-log = "2.7.1"
log = "0.4.28"
webbrowser = "1"
url = "2.5.7"

[profile.dev]
incremental = false
#rustflags = ["-Zthreads=12"]

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = 3
panic = "unwind"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.9.0"
#rustflags = ["-Zthreads=12"]
