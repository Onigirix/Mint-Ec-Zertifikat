<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" type="module" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schüler erstellen</title>
  </head>
  <body>
    <div id="schuelerPopup" class="popup-container">
      <h2>
        <i class="material-icons">person_add</i>
        Schüler erstellen
      </h2>
      <form id="schuelerForm">
        <div class="form-group">
          <label for="vorname">
            <i class="material-icons">person</i>
            Vorname:
          </label>
          <input
            type="text"
            id="vorname"
            name="vorname"
            placeholder="Vorname eingeben..."
            required
          />
        </div>

        <div class="form-group">
          <label for="nachname">
            <i class="material-icons">person</i>
            Nachname:
          </label>
          <input
            type="text"
            id="nachname"
            name="nachname"
            placeholder="Nachname eingeben..."
            required
          />
        </div>

        <div class="form-group">
          <label for="abijahr">
            <i class="material-icons">school</i>
            Abijahrgang:
          </label>
          <input
            type="text"
            id="abijahr"
            name="Abijahr"
            placeholder="z.B. 2024"
            required
          />
        </div>

        <div class="form-group">
          <label for="geburtsdatum">
            <i class="material-icons">cake</i>
            Geburtsdatum:
          </label>
          <input type="date" id="geburtsdatum" name="geburtsdatum" required />
        </div>

        <div class="button-group">
          <button type="submit" class="blauerButton" id="fertig">
            <i class="material-icons">check</i>
            Fertig
          </button>
          <button type="submit" class="blauerButton" id="save">
            <i class="material-icons">add</i>
            Speichern & Neuer Schüler
          </button>
          <button type="button" class="roterButton" id="schuelerAbbrechen">
            <i class="material-icons">close</i>
            Abbrechen
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
