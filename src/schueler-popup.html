<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-init.js" type="module" defer></script>
    <script src="popup.js" type="module" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schüler erstellen</title>
  </head>
  <body class="app-root page-student-popup">
    <div id="schuelerPopup">
      <h2>Schüler erstellen</h2>
      <form id="schuelerForm">
      <label for="vorname">Vorname:</label>
      <input type="text" id="vorname" name="vorname"
        style="margin-left: 2px; max-width: 97%;" required /><br />
      <label for="nachname">Nachname:</label>
      <input type="text" id="nachname" name="nachname"
        style="margin-left: 2px; max-width: 97%;" required /><br />
      <label for="abijahr">Abijahrgang:</label>
      <input type="text" id="abijahr" name="Abijahr"
        style="margin-left: 2px; max-width: 97%;" 
        pattern="\d{4}" 
        inputmode="numeric"
        maxlength="4"
        required /><br />
      <label for="geburtsdatum">Geburtsdatum:</label>
      <input style="margin-left: 2px; max-width: 96%;"
        type="date"
        id="geburtsdatum"
        name="geburtsdatum"
        required /><br />
      <label for="school">Schule:</label>
      <select id="school" name="schule" style="margin-left: 2px; max-width: 97%;" required>
      </select><br />
      <button type="button" id="add-school">+ Schule hinzufügen</button><br />
      <button type="submit" class="blauerButton" id="fertig">Fertig</button>
      <button type="submit" class="blauerButton" id="save">
        Speichern und neuen Schüler eingeben
      </button>
      <button type="button" class="roterButton" id="schuelerAbbrechen">
        Abbrechen
      </button>
      </form>
      <dialog id="new-school-dialog">
        <form id="new-school-form">
          <label for="new-school-name">Name der neuen Schule:</label>
          <input id="new-school-name" type="text" required />
          <button type="submit" class="blauerButton">Hinzufügen</button>
          <button type="button" id="cancel-new-school">Abbrechen</button>
        </form>
      </dialog>
    </div>
  </body>
</html>
