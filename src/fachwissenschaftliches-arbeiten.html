<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="style_fwa.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINT-EC-Zertifikat</title>
    <script type="module" src="main.js" defer></script>
    <script
      type="module"
      src="fachwissenschaftliches-arbeiten.js"
      defer
    ></script>
    <script type="module" src="createSchuelerPopup.js" defer></script>
  </head>

  <body>
    <!-- Header with Button for Navigation-->
    <header id="header">
      <button id="openNav" class="openNav">
        <i class="material-icons">menu</i>
      </button>
      <div id="schülerEingabe">
        <input
          class="search-box"
          type="text"
          id="student-search"
          placeholder="Schüler..."
          value=""
        />
        <ul id="suggestions" class="suggestions-list"></ul>
        <button id="create-student" class="blauerButton">
          Schüler erstellen
        </button>
      </div>
      <a style="text-decoration: none; color: #ffffffaa; font-weight: bolder; font-size: x-large;" class="rightHeading" href="contributors.html">Mint-EC Zertifikat<a>
      <!-- <div id="schuelerAnzeige"></div>  Bereich zur Anzeige des Schülers -->
    </header>

    <!-- Sidenavigation with close Button -->
    <div id="sidenav" class="sidenav">
      <a id="closeNav"><i class="material-icons">close</i></a>
      <div id="navLinks">
        <a href="index.html" id="Startseite">Startseite</a>
        <a href="schuelerbearbeiten.html" id="Schülerliste">Schülerliste</a>
        <a href="fachliche-kompetenz.html" id="Fachliche-Kompetenz"
          >Fachliche Kompetenz</a
        >
        <a
          href="fachwissenschaftliches-arbeiten.html"
          id="Fachwissenschaftliches-Arbeiten"
          >Fachwissenschaftliches Arbeiten</a
        >
        <a href="zusaetzlich.html" id="Zusätzliche-MINT-Aktivitäten"
          >Zusätzliche MINT-Aktivitäten</a
        >
        <a href="export.html" id="export">Exportieren</a>
        <a href="settings.html" id="settings">Einstellungen</a>
      </div>
    </div>

    <!--Main Content-->
    <div id="main">
      <main id="content">
        <h1 style="color: #6C9644">Fachwissenschaftliches Arbeiten</h1>

        <form id="facharbeitForm" class="darken">
          <div class="form-group">
            <label for="arbeitTyp">
              <i class="material-icons">category</i>
              Typ der Arbeit:
            </label>
            <select id="arbeitTyp" required class="disabled-no-student" disabled>
              <option value="0" disabled selected>Bitte wählen</option>
              <option value="1">Facharbeit</option>
              <option value="2">wissenschaftspropädeutisches Fach</option>
              <option value="3">besondere Lernleistung</option>
              <option value="4">Jugend forscht Projekt</option>
              <option value="5">Anderer Wettbewerb</option>
            </select>
          </div>

          <div class="form-group">
            <label for="thema">
              <i class="material-icons">title</i>
              Thema:
            </label>
            <input
              type="text"
              id="thema"
              required
              class="disabled-no-student"
              disabled
              placeholder="Thema der Arbeit eingeben..."
            />
          </div>

          <div class="form-group">
            <label for="beschreibung">
              <i class="material-icons">description</i>
              Beschreibung:
            </label>
            <textarea
              id="beschreibung"
              rows="6"
              class="disabled-no-student"
              disabled
              placeholder="Beschreibung der Arbeit eingeben..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="level" id="note_label">
              <i class="material-icons">grade</i>
              Note:
            </label>
            <input
              type="number"
              id="level"
              min="1"
              max="15"
              step="1"
              class="disabled-no-student"
              disabled
              placeholder="1-15"
            />
          </div>

          <button
            type="submit"
            class="btn submit-btn"
            id="submitBtn submitFachwissenschaftlichesArbeiten"
          >
            <i class="material-icons">save</i>
            Speichern
          </button>
        </form>

        <div class="navigation-buttons">
          <button
            class="blauerButton"
            onclick="window.location.href='fachliche-kompetenz.html';"
          >
            <i class="material-icons">arrow_back</i>
            Zurück
          </button>
          <button
            class="blauerButton"
            id="submitBtn"
            onclick="window.location.href='zusaetzlich.html';"
          >
            Weiter
            <i class="material-icons">arrow_forward</i>
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
