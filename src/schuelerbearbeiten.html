<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINT-EC-Zertifikat</title>
    <link rel="preload" href="assets/MaterialSymbolsRounded.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="schuelerbearbeiten.css" />
    <script type="module" src="main.js" defer></script>
    <script type="module" src="schuelerbearbeiten.js" defer></script>
    <script type="module" src="createSchuelerPopup.js" defer></script>
  </head>
  <body>
    <!-- Header with Button for Navigation-->
    <header id="header">
      <button id="openNav" class="openNav">
        <i class="material-icons">menu</i>
      </button>
      <div></div>
      <a style="text-decoration: none; color: #ffffffaa; font-weight: bolder; font-size: x-large;" class="rightHeading" href="contributors.html">Mint-EC Zertifikat<a>

      <!-- <div id="schuelerAnzeige"></div>  Bereich zur Anzeige des Schülers -->
    </header>

    <!-- Sidenavigation with close Button -->
    <div id="sidenav" class="sidenav">
      <a id="closeNav"><i class="material-icons">close</i></a>
      <div id="navLinks">
        <a href="index.html" id="Startseite">Startseite</a>
        <a href="schuelerbearbeiten.html" id="Schülerliste">Schülerliste</a>
        <a href="fachliche-kompetenz.html" id="Fachliche-Kompetenz">Fachliche
          Kompetenz</a>
        <a
          href="fachwissenschaftliches-arbeiten.html"
          id="Fachwissenschaftliches-Arbeiten">Fachwissenschaftliches
          Arbeiten</a>
        <a href="zusaetzlich.html" id="Zusätzliche-MINT-Aktivitäten">Zusätzliche
          MINT-Aktivitäten</a>
        <a href="export.html" id="export">Exportieren</a>
        <a href="settings.html" id="settings">Einstellungen</a>
        <a href="donation.html" id="donation">Spenden</a>
      </div>
    </div>

    <!--Main Content-->
    <div id="main">
      <main id="content">
        <h1 style="margin-bottom: 10px;">Schülerliste</h1>
        <div id="filter-container" style="display: flex; gap: 20px; margin-bottom: 10px; align-items: center; justify-content: center;">
          <input
            class="search-box"
            type="text"
            id="student-filter"
            placeholder="Schüler suchen..."
            autocomplete="off"
            style="width: 250px;"
          />
          <div style="display: flex; align-items: center; gap: 10px;">
            <label for="year-filter" style="color: #333;">Jahrgang:</label>
            <input
              class="search-box"
              type="text"
              id="year-filter"
              placeholder="z.B. 2027"
              autocomplete="off"
              style="width: 100px;"
            />
          </div>
        </div>
        <div id="table-container"
          style="max-height: 55vh; overflow: auto;"></div>
          <div class="button-container">
            <button class="add-button" class="grünerButton" id="add-student">
              Neuen Schüler hinzufügen
            </button>

            <button id="deleteButton" class="grünerButton" disabled>
              Ausgewählten Schüler löschen
            </button>
            <button id="editButton" class="grünerButton" disabled>
              Schüler bearbeiten
            </button>
            <button id="deleteYearButton" class="grünerButton" disabled>
              Jahrgang des ausgewählten Schüler löschen
            </button>
            <button class="blauerButton"
              onclick="window.location.href='fachliche-kompetenz.html';"
              style="margin-left: 5%;"><span class="material-symbols-rounded">arrow_forward</span></button>

          </div>
        </main>
      </div>
    </body>
  </html>
