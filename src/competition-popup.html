<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="competition-popup.js" type="module" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wettbewerb erstellen</title>
  </head>
  <body>
    <div id="competitionPopup" class="popup-container">
      <h2>
        <i class="material-icons">emoji_events</i>
        Wettbewerb erstellen
      </h2>
      <form id="competitionForm">
        <div class="form-group">
          <label for="competitionName">
            <i class="material-icons">title</i>
            Name:
          </label>
          <input
            type="text"
            id="competitionName"
            name="competitionName"
            placeholder="Name des Wettbewerbs..."
            required
          />
        </div>

        <div class="form-group">
          <label for="firstLevel">
            <i class="material-icons">looks_one</i>
            Erste Stufe:
          </label>
          <input
            type="text"
            id="firstLevel"
            name="firstLevel"
            placeholder="Beschreibung der ersten Stufe..."
          />
        </div>

        <div class="form-group">
          <label for="secondLevel">
            <i class="material-icons">looks_two</i>
            Zweite Stufe:
          </label>
          <input
            type="text"
            id="secondLevel"
            name="secondLevel"
            placeholder="Beschreibung der zweiten Stufe..."
          />
        </div>

        <div class="form-group">
          <label for="thirdLevel">
            <i class="material-icons">looks_3</i>
            Dritte Stufe:
          </label>
          <input
            type="text"
            id="thirdLevel"
            name="thirdLevel"
            placeholder="Beschreibung der dritten Stufe..."
          />
        </div>

        <div class="form-group">
          <label>
            <i class="material-icons">school</i>
            Sekundarstufe:
          </label>
          <div class="checkbox-group" id="sek-container">
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="sek-1"
                class="sek-checkbox"
                value="1"
              />
              <label for="sek-1">Sekundarstufe I</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="sek-2"
                class="sek-checkbox"
                value="2"
              />
              <label for="sek-2">Sekundarstufe II</label>
            </div>
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="blauerButton" id="fertig">
            <i class="material-icons">check</i>
            Fertig
          </button>
          <button type="submit" class="blauerButton" id="save">
            <i class="material-icons">add</i>
            Speichern & Neuer Wettbewerb
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
