<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="edit-competition-popup.js" type="module" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wettbewerb bearbeiten</title>
  </head>
  <body>
    <div id="competitionPopup" class="popup-container">
      <h2 id="heading">
        <i class="material-icons">edit</i>
        Wettbewerb bearbeiten
      </h2>
      <form id="competitionForm">
        <div class="form-group">
          <label for="competitionName">
            <i class="material-icons">title</i>
            Name:
          </label>
          <input
            type="text"
            id="competitionName"
            name="competitionName"
            placeholder="Name des Wettbewerbs..."
            required
          />
        </div>

        <div class="form-group">
          <label for="firstLevel">
            <i class="material-icons">looks_one</i>
            Erste Stufe:
          </label>
          <input
            type="text"
            id="firstLevel"
            name="firstLevel"
            placeholder="Beschreibung der ersten Stufe..."
            required
          />
        </div>

        <div class="form-group">
          <label for="secondLevel">
            <i class="material-icons">looks_two</i>
            Zweite Stufe:
          </label>
          <input
            type="text"
            id="secondLevel"
            name="secondLevel"
            placeholder="Beschreibung der zweiten Stufe..."
            required
          />
        </div>

        <div class="form-group">
          <label for="thirdLevel">
            <i class="material-icons">looks_3</i>
            Dritte Stufe:
          </label>
          <input
            type="text"
            id="thirdLevel"
            name="thirdLevel"
            placeholder="Beschreibung der dritten Stufe..."
            required
          />
        </div>

        <div class="button-group">
          <button type="button" class="roterButton" id="abbrechen">
            <i class="material-icons">close</i>
            Abbrechen
          </button>
          <button type="submit" class="blauerButton" id="fertig">
            <i class="material-icons">check</i>
            Fertig
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
