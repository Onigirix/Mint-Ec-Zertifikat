<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="style_set.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINT-EC-Zertifikat</title>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="settings.js" defer></script>
  </head>

  <body>
    <!-- Header with Button for Navigation-->
    <header id="header">
      <button id="openNav" class="openNav">
        <i class="material-icons">menu</i>
      </button>
      <div></div>
      <a style="text-decoration: none; color: #ffffffaa; font-weight: bolder; font-size: x-large;" class="rightHeading" href="contributors.html">Mint-EC Zertifikat<a>
     
    </header>

    <!-- Sidenavigation with close Button -->
    <div id="sidenav" class="sidenav">
      <a id="closeNav"><i class="material-icons">close</i></a>
      <div id="navLinks">
        <a href="index.html" id="Startseite">Startseite</a>
        <a href="schuelerbearbeiten.html" id="Schülerliste">Schülerliste</a>
        <a href="fachliche-kompetenz.html" id="Fachliche-Kompetenz"
          >Fachliche Kompetenz</a
        >
        <a
          href="fachwissenschaftliches-arbeiten.html"
          id="Fachwissenschaftliches-Arbeiten"
          >Fachwissenschaftliches Arbeiten</a
        >
        <a href="zusaetzlich.html" id="Zusätzliche-MINT-Aktivitäten"
          >Zusätzliche MINT-Aktivitäten</a
        >
        <a href="export.html" id="export">Exportieren</a>
        <a href="settings.html" id="settings">Einstellungen</a>
      </div>
    </div>

    <!--Main Content-->
    <div id="main">
      <main id="content">
        <h1>Einstellungen</h1>

        <form id="settingsForm">
          <div class="form-section">
            <h3>
              <i class="material-icons">school</i>
              Schulinformationen
            </h3>
            
            <div class="form-group">
              <label for="schoolName">
                <i class="material-icons">business</i>
                Prefix und Name der Schule:
              </label>
              <input type="text" id="schoolName" placeholder="z.B. Gymnasium Musterstadt" />
            </div>

            <div class="form-group">
              <label for="schoolLocation">
                <i class="material-icons">location_on</i>
                Ort der Schule:
              </label>
              <input type="text" id="schoolLocation" placeholder="z.B. Musterstadt" />
            </div>
          </div>

          <div class="form-section">
            <h3>
              <i class="material-icons">folder</i>
              Ausgabeeinstellungen
            </h3>
            
            <div class="form-group">
              <label for="outputPath">
                <i class="material-icons">save</i>
                Ausgabepfad:
              </label>
              <div class="folder-input">
                <input type="text" id="outputPath" placeholder="Pfad auswählen..." />
                <button type="button" id="folderSelectButton" class="folder-button">
                  <i class="material-icons">folder_open</i>
                </button>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>
              <i class="material-icons">edit</i>
              Unterzeichner
            </h3>
            
            <div class="signers-container">
              <div class="signer-group">
                <h4>Linksunterzeichner</h4>
                <div class="form-group">
                  <label for="namePos1">
                    <i class="material-icons">person</i>
                    Name:
                  </label>
                  <input type="text" id="namePos1" placeholder="Vollständiger Name" />
                </div>
                <div class="form-group">
                  <label for="pos1">
                    <i class="material-icons">work</i>
                    Position:
                  </label>
                  <input type="text" id="pos1" placeholder="z.B. Schulleiter/in" />
                </div>
              </div>

              <div class="signer-group">
                <h4>Rechtsunterzeichner</h4>
                <div class="form-group">
                  <label for="namePos2">
                    <i class="material-icons">person</i>
                    Name:
                  </label>
                  <input type="text" id="namePos2" placeholder="Vollständiger Name" />
                </div>
                <div class="form-group">
                  <label for="pos2">
                    <i class="material-icons">work</i>
                    Position:
                  </label>
                  <input type="text" id="pos2" placeholder="z.B. MINT-Koordinator/in" />
                </div>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
